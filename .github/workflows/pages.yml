name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-gateway:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install gateway build dependencies
        run: python -m pip install -r gateway/requirements.txt
      - name: Test gateway
        run: python -m unittest discover -s gateway -p test_gateway.py -v
      - name: Build Windows gateway
        run: |
          New-Item -ItemType Directory -Force gateway\.build | Out-Null
          python -m PyInstaller --onefile --name telnet-gateway --distpath gateway-dist --workpath "$env:RUNNER_TEMP\gateway-build" --specpath gateway\.build gateway\gateway.py
      - uses: actions/upload-artifact@v4
        with:
          name: telnet-gateway-windows
          path: gateway-dist/telnet-gateway.exe
          if-no-files-found: error

  deploy:
    needs: build-gateway
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: telnet-gateway-windows
          path: public/downloads
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
